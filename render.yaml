services:
  - type: web
    name: todo-mcp-server
    runtime: python
    rootDir: mcp-server
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false

  - type: web
    name: todo-pwa
    runtime: static
    rootDir: pwa
    buildCommand: npm install && npm run build
    staticPublishPath: dist
